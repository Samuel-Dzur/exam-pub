spring.application.name=hospoda-backend
server.servlet.context-path=/api
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
app.storage.root=${APP_STORAGE_ROOT:storage}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/application}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/application/protocol/openid-connect/certs}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}
