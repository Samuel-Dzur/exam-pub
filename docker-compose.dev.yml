services:
  postgres:
    image: postgres:18.6
    container_name: hospoda-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - hospoda-data:/var/lib/postgresql
      - ./init-database:/docker-entrypoint-initdb.d
    networks:
      - hospoda-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
  
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev --import-realm
    container_name: hospoda-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://hospoda-postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes:ro
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hospoda-network

  backend:
    image: eclipse-temurin:25-jdk-noble
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: bash ./gradlew bootRun
    container_name: hospoda-backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./backend/src/main/java/samuel/dzur/hospoda/backend/storage:/app/storage
    ports:
      - "8081:8080"
      - "5005:5005" # Debug port
    environment:
      SPRING_PROFILES_ACTIVE: dev
      APP_STORAGE_ROOT: /app/storage
      SPRING_DATASOURCE_URL: jdbc:postgresql://hospoda-postgres:5432/application
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/application
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/application/protocol/openid-connect/certs
      APP_CORS_ALLOWED_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - hospoda-network
  
  frontend:
    image: node:24-alpine
    command: sh -c "npm install && npm run dev"
    container_name: hospoda-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:8081
    networks:
      - hospoda-network
    depends_on:
      backend:
        condition: service_started

volumes:
  hospoda-data:

networks:
  hospoda-network:
    driver: bridge
